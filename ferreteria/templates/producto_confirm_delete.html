{% extends 'base.html' %} 

{% block title %}Eliminar Producto | FerreteríaPro{% endblock %} 

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="bg-white p-5 border text-center">
                <div class="mb-4">
                    <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
                </div>
                
                <h3 class="fw-bold mb-3">¿Eliminar Producto?</h3>
                
                <p class="text-muted mb-4">
                    Estás a punto de eliminar permanentemente el producto <br>
                    <strong class="text-dark fs-5">"{{ object.nombre }}"</strong>.<br>
                    Esta acción no se puede deshacer.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4 pt-3 border-top">
                        <a href="../../../catalogo/" class="btn btn-outline-dark rounded-0 px-4">
                            Cancelar
                        </a>
                        <!-- Se usa btn-danger para mantener la convención de destrucción, pero con rounded-0 -->
                        <button type="submit" class="btn btn-danger rounded-0 px-4">
                            Sí, Eliminar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
